name: Applications Android et iOS

# Construit les applications Android et iOS à partir de l'app web (Capacitor).
# - À chaque mise à jour de main, et à la main depuis l'onglet Actions (« Run workflow »).
# - Les fichiers produits sont à télécharger en bas de la page du lancement (rubrique « Artifacts »).
# Les secrets de signature sont facultatifs : sans eux, la construction est vérifiée mais rien n'est envoyé aux stores.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/applis-natives.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applis-natives-${{ github.ref }}
  cancel-in-progress: true

env:
  # Version visible dans les stores (à monter à chaque publication) ; le numéro de construction augmente tout seul
  VERSION_NAME: '0.1.0'
  VERSION_CODE: ${{ github.run_number }}

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      # Alertes « app fermée » sur Android : fichier google-services.json du projet Firebase (secret facultatif)
      - name: Fichier Firebase (si le secret existe)
        if: env.FIREBASE != ''
        run: |
          echo "$FIREBASE" > android/app/google-services.json
          echo "VITE_PUSH_ANDROID=1" >> "$GITHUB_ENV"
      - name: App web pour les applications
        run: npm run natif:build
      - run: npx cap sync android
      - name: Clé de signature Play Store (si les secrets existent)
        if: env.CLE != ''
        run: |
          echo "$CLE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Construction (APK de test + AAB pour le Play Store)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: vigipop-android-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vigipop-android-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      # Lien direct pour installer l'app de test sur un téléphone, sans compte GitHub ni zip :
      # https://github.com/thomas-dixneuf/vigipop-app/releases/download/android-test/vigipop-test.apk
      - name: Lien direct de l'app de test (main seulement)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk vigipop-test.apk
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease \
            --title "App Android de test" --notes "Version de test, mise à jour à chaque modification de l'app. Ne pas diffuser au public."
          gh release upload android-test vigipop-test.apk --clobber

  ios:
    name: iOS
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: App web pour les applications
        run: npm run natif:build
      - run: npx cap sync ios
      - name: Construction de vérification (sans compte Apple)
        if: env.APPLE_API_KEY_ID == ''
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION=$VERSION_CODE MARKETING_VERSION=$VERSION_NAME \
            build
      # Avec le compte Apple Developer : archive signée automatiquement puis envoyée sur TestFlight / App Store Connect
      - name: Archive signée et envoi sur App Store Connect
        if: env.APPLE_API_KEY_ID != ''
        working-directory: ios/App
        run: |
          mkdir -p private_keys
          echo "$APPLE_API_KEY_P8" > "private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          CLE="$PWD/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Vigipop.xcarchive \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=$VERSION_CODE MARKETING_VERSION=$VERSION_NAME \
            -allowProvisioningUpdates -authenticationKeyPath "$CLE" \
            -authenticationKeyID $APPLE_API_KEY_ID -authenticationKeyIssuerID $APPLE_API_ISSUER_ID \
            archive
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Vigipop.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates -authenticationKeyPath "$CLE" \
            -authenticationKeyID $APPLE_API_KEY_ID -authenticationKeyIssuerID $APPLE_API_ISSUER_ID
          rm -rf private_keys
